# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Weil Bounds Toolkit"
  description: >-
    A Lean 4 formalization of the classical prime-modulus Kloosterman-Weil
    bound |S_p(m,n)| <= 2 sqrt(p) for nonzero m, n, proved by the
    Carlitz-Stepanov method following Harcos's exposition, together with an
    exact Chinese-remainder factorization of unit Kloosterman sums, a
    squarefree-modulus bound for a unit first coefficient, a bound for the sum
    defined at the reduced modulus q/gcd(A,q), and interval-length-uniform and
    weighted bounds for centered incomplete reciprocal sums.
  authors:
    - "Charlie Dorsey"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Charlie Dorsey"

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11L05", "11T23", "68V20"]

sources:
  - title: "On Some Exponential Sums"
    authors:
      - "André Weil"
    id: "doi:10.1073/pnas.34.5.204"
    type: "article"
    location: "Proceedings of the National Academy of Sciences of the USA 34(5) (1948), 204-207"
    relationship: "independently-proves"
    note: >-
      Origin of the prime-modulus bound. The formal proof does not follow
      Weil's route through the Riemann hypothesis for curves; it follows the
      elementary Carlitz-Stepanov method as expounded by Harcos.
  - title: "Weil's Bound for Kloosterman Sums (expository notes)"
    authors:
      - "Gergely Harcos"
    id: "https://users.renyi.hu/~gharcos/weil.pdf"
    type: "expository notes"
    location: "https://users.renyi.hu/~gharcos/weil.pdf"
    relationship: "adapts"
    note: >-
      Main followed exposition (Theorem 1; equations (1)-(3), sections 3-5,
      equations (11)-(22)). Harcos's theorem assumes p odd; the case p = 2 is
      proved separately here. Coefficient conventions and normalizations are
      the formalization's own and are bridged explicitly.
  - title: "Kloosterman Sums and Finite Field Extensions"
    authors:
      - "L. Carlitz"
    id: "doi:10.4064/aa-16-2-179-194"
    type: "article"
    location: "Acta Arithmetica 16(2) (1969), 179-194"
    relationship: "adapts"
    note: >-
      Extension-field sums and the quadratic recurrence. The toolkit's exact
      generating-series normalization has not been matched equation by
      equation to the original article.
  - title: "An Estimation of Kloosterman Sums"
    authors:
      - "S. A. Stepanov"
    id: "doi:10.1070/IM1971v005n02ABEH001049"
    type: "article"
    location: "Mathematics of the USSR-Izvestiya 5(2) (1971), 319-336"
    relationship: "background"
  - title: "An Elementary Proof of the Hasse-Weil Theorem for Hyperelliptic Curves"
    authors:
      - "S. A. Stepanov"
    id: "doi:10.1016/0022-314X(72)90059-5"
    type: "article"
    location: "Journal of Number Theory 4(2) (1972), 118-143"
    relationship: "background"
    note: "Auxiliary-polynomial and curve-point counting methods."
  - title: "Analytic Number Theory"
    authors:
      - "Henryk Iwaniec"
      - "Emmanuel Kowalski"
    id: "AMS Colloquium Publications 53"
    type: "book"
    location: "American Mathematical Society, 2004"
    relationship: "background"
    note: "Chapters 11-12: exponential sums and completion methods underlying the CRT and incomplete-sum results."

related_formalizations: []

status:
  scope: >-
    Formalized: the nondegenerate prime Kloosterman-Weil bound for two nonzero
    coefficients in ZMod p (including p = 2); the exact equality between the
    source-normalized sum K_p(a,b) and the conventional S_p(b,a); exact CRT
    factorization of unit Kloosterman sums for coprime moduli with
    Bezout-normalized coefficients; the bound 2^omega(q) sqrt(q) for a
    squarefree modulus when the first coefficient is a unit; the same bound
    for the sum defined at the reduced modulus q/gcd(A,q) with reduced
    numerator; and interval-length-uniform and reciprocal-weighted bounds for
    the centered reciprocal phase at the reduced squarefree modulus. Not
    formalized: a general gcd-sensitive composite Weil bound for arbitrary
    numerators; any identity lifting the reduced-modulus sum back to the
    original modulus; nondegenerate prime estimates with a zero coefficient
    (degenerate cases are handled by separate elementary identities);
    arbitrary-length bounds for the uncentered reciprocal phase.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["OpenAI ChatGPT astra 6", "Anthropic Claude Opus 5.5"]
      framework: "Desktop Commander"
      tool_setup: >-
        AI-assisted development by AI agents with local shell access through
        Desktop Commander, compiling against the pinned Lean toolchain and
        Mathlib, directed and reviewed by the human author.
      cost:
        wall_time: "Approximately 2 days of consistent extraction and generalization effort, following initial development for specific use in a paper; original paper-specific effort not separately quantified."
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The human author directed the extraction of reusable Kloosterman-Weil
        machinery from a larger research development into a standalone
        toolkit, set scope and interfaces, and requested checks and revisions.
        Token usage is unknown because development occurred through chat interfaces.
  spend_usd: "subscription-based"
  notes: >-
    Generative AI systems made substantive intellectual and technical
    contributions to designing the toolkit and its interfaces, mathematical
    development and proof exploration, writing the Lean formalization, review
    and checking, documentation, and release preparation. Charlie Dorsey
    directed the work, steered its scope, critically reviewed presentations
    and mathematical claims, and is responsible for licensing, publication
    decisions and the accuracy of public claims. The formal claims rest on
    Lean kernel checking under the stated hypotheses and axioms; this is not an
    independent human rederivation of every proof.

fidelity:
  divergences: >-
    The source-normalized sum K_p(a,b) = sum_{x != 0} e_p(b x + a x^-1) has its
    coefficients in the opposite order to the conventional S_p(m,n); the
    theorem kloostermanSumPrime_eq_weilKloostermanPrime proves
    K_p(a,b) = S_p(b,a), and weil1948_bound is stated in conventional order.
    Harcos's Theorem 1 assumes p odd; p = 2 is proved separately. The
    composite and incomplete-sum results carry the explicit extra hypotheses
    listed in the scope (unit first coefficient; sums defined at the reduced
    modulus; centered phase) and are not general composite Weil bounds.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Statement audit by the author against the cited sources; clean rebuilds
    locally and in GitHub Actions; axiom audit (docs/check_axioms.py) showing
    only propext, Classical.choice and Quot.sound for the public theorems. No
    independent external human mathematical review has been performed.

alignment:
  namespace: "RML.ExpSum.Weil"
  statements:
    - source: "Weil (1948), main estimate; Harcos (2015), Theorem 1"
      lean: "RML.ExpSum.Weil.weil1948_bound"
      module: "rml.weil.prime_kloosterman"
      status: "proved"
      note: "Conventional coefficient order; both coefficients nonzero; all primes including p = 2."
    - source: "Harcos (2015), Theorem 1, equation (1) normalization"
      lean: "RML.ExpSum.Weil.prime_bound"
      module: "rml.weil.prime_kloosterman"
      status: "proved"
      note: "Source-normalized coefficient order K_p(a,b); equivalent to weil1948_bound."
    - source: "Coefficient-order convention bridge"
      lean: "RML.ExpSum.Weil.kloostermanSumPrime_eq_weilKloostermanPrime"
      module: "rml.weil.prime_foundation"
      status: "proved"
      note: "K_p(a,b) = S_p(b,a), by definitional equality."
    - source: "Standard CRT factorization of Kloosterman sums (Iwaniec-Kowalski, ch. 11-12)"
      lean: "RML.ExpSum.Weil.kloostermanUnitSum_crt"
      module: "rml.weil.crt_and_completion"
      status: "proved"
      note: "Exact factorization with Bezout-normalized coefficients for coprime moduli."
    - source: "Squarefree-modulus consequence of the prime bound"
      lean: "RML.ExpSum.Weil.squarefreeUnitNumerator_bound"
      module: "rml.weil.contracts"
      status: "proved"
      note: "Requires a squarefree modulus and a unit first coefficient."
    - source: "Positivity of the reduced modulus (auxiliary)"
      lean: "RML.ExpSum.Weil.reducedModulus_pos"
      module: "rml.weil.crt_and_completion"
      status: "proved"
      note: "Supplies the NeZero instance appearing in the reduced-modulus statements."
    - source: "Reduced-modulus bound"
      lean: "RML.ExpSum.Weil.reducedModulusSum_bound"
      module: "rml.weil.contracts"
      status: "proved"
      note: "Concerns the sum defined at q/gcd(A,q); no lifting to the original modulus is claimed."
    - source: "Completion method for incomplete sums (Iwaniec-Kowalski, ch. 12)"
      lean: "RML.ExpSum.Weil.centeredReducedIntervalSum_bound"
      module: "rml.weil.contracts"
      status: "proved"
      note: "Interval-length uniform; applies to the centered reciprocal phase only."
    - source: "Partial summation with reciprocal weights"
      lean: "RML.ExpSum.Weil.weightedCenteredReducedIntervalSum_bound"
      module: "rml.weil.contracts"
      status: "proved"
      note: "Positive initial weight Y; centered phase."

acknowledgements: >-
  Built on Lean 4 and Mathlib. The proof follows Gergely Harcos's exposition of
  the Carlitz-Stepanov method. Packaging follows the Palomar starter template
  (PalomarRegistry/PalomarTemplate, Apache-2.0), from which
  scripts/verify-comparator.sh and scripts/check-lean-sources.py are copied.
